name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Internal links only (external URLs skipped to avoid flaky runs).
      # favicon.svg is skipped: Starlight's default /favicon.svg is missing
      # (no public/ dir) -- TODO add a favicon and drop this skip.
      - run: npm run linkcheck
